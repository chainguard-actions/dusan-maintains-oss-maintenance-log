name: Test with compute-health-scores disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal custom config
        run: |
          mkdir -p /tmp/oss-no-health-test/config
          cat > /tmp/oss-no-health-test/config/tracked-repositories.json <<'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 48,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Active",
                "maintainer_needed_signal": "Actively maintained",
                "tracked_pr_numbers": [],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-file: /tmp/oss-no-health-test/config/tracked-repositories.json
          evidence-dir: /tmp/oss-no-health-test/evidence
          compute-health-scores: "false"

      - name: Assert action ran and outputs are set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
          HEALTH: ${{ steps.action.outputs.health-json }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          AVG: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "outcome: $OUTCOME"
          echo "manifest-json: $MANIFEST"
          echo "health-json: $HEALTH"
          echo "critical-count: $CRITICAL"
          echo "avg-health: $AVG"

          if [ "$OUTCOME" = "success" ]; then
            # manifest-json should always be set
            if [ -z "$MANIFEST" ]; then
              echo "FAIL: action succeeded but manifest-json output is empty"
              exit 1
            fi
            # critical-count and avg-health should be set (defaulting to 0 when no health file)
            if [ -z "$CRITICAL" ]; then
              echo "FAIL: critical-count output is empty"
              exit 1
            fi
            if [ -z "$AVG" ]; then
              echo "FAIL: avg-health output is empty"
              exit 1
            fi
            echo "PASS: all outputs are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API calls may fail in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
