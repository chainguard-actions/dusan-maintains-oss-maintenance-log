name: Test custom evidence directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-config"
          cat > "$GITHUB_WORKSPACE/test-config/tracked-repositories.json" <<'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 24,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Active",
                "maintainer_needed_signal": "Actively maintained",
                "tracked_pr_numbers": [],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-file: test-config/tracked-repositories.json
          evidence-dir: my-custom-evidence
          compute-health-scores: "true"
        continue-on-error: true

      - name: Assert health-json output path contains custom evidence dir
        env:
          HEALTH_JSON: ${{ steps.action.outputs.health-json }}
          MANIFEST_JSON: ${{ steps.action.outputs.manifest-json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "health-json: $HEALTH_JSON"
          echo "manifest-json: $MANIFEST_JSON"
          if [ "$OUTCOME" = "success" ]; then
            # Verify the output paths reference the custom evidence directory
            if echo "$HEALTH_JSON" | grep -q "my-custom-evidence"; then
              echo "PASS: health-json path contains custom evidence dir"
            else
              echo "FAIL: health-json='$HEALTH_JSON' does not contain 'my-custom-evidence'"
              exit 1
            fi
            if echo "$MANIFEST_JSON" | grep -q "my-custom-evidence"; then
              echo "PASS: manifest-json path contains custom evidence dir"
            else
              echo "FAIL: manifest-json='$MANIFEST_JSON' does not contain 'my-custom-evidence'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to API limits or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert evidence directory was created when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$GITHUB_WORKSPACE/my-custom-evidence" ]; then
              echo "FAIL: custom evidence directory 'my-custom-evidence' was not created"
              exit 1
            fi
            echo "PASS: custom evidence directory exists"
            ls -la "$GITHUB_WORKSPACE/my-custom-evidence/" || true
          else
            echo "SKIP: action did not succeed, skipping directory check"
          fi
