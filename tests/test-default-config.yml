name: Test default config file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq
            apt-get install -y -qq wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y -qq powershell
          fi
          pwsh --version

      # The action defaults to config/tracked-repositories.json which exists in the repo.
      # Use an absolute path so Resolve-RepoPath passes it through unchanged.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-file: ${{ github.workspace }}/config/tracked-repositories.json
          evidence-dir: /tmp/test-evidence-default-config

      - name: Assert action completed and manifest-json output is set
        env:
          MANIFEST_PATH: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "manifest-json: $MANIFEST_PATH"
          if [ -z "$MANIFEST_PATH" ]; then
            echo "FAIL: manifest-json output is empty — action may have failed to read default config"
            exit 1
          fi
          echo "PASS: manifest-json output is set"

      - name: Assert manifest.json file was created
        env:
          MANIFEST_PATH: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Checking for manifest file at: $MANIFEST_PATH"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "FAIL: manifest.json not found at $MANIFEST_PATH"
            ls /tmp/test-evidence-default-config/ 2>/dev/null || echo "(evidence dir missing)"
            exit 1
          fi
          echo "PASS: manifest.json exists at $MANIFEST_PATH"

      - name: Assert manifest contains tracked repositories from default config
        env:
          MANIFEST_PATH: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Checking manifest has repositories..."
          REPO_COUNT=$(python3 -c "import json; d=json.load(open('$MANIFEST_PATH')); print(d['summary']['tracked_repositories'])")
          echo "tracked_repositories: $REPO_COUNT"
          if [ "$REPO_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 tracked repository, got $REPO_COUNT"
            exit 1
          fi
          echo "PASS: manifest tracks $REPO_COUNT repositories from default config"
