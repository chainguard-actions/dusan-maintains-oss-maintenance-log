name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/basic
          threshold: "0"
          include-dev: "false"
          github-token: ${{ github.token }}

      - name: Assert results output is set
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          echo "PASS: results output is set"

      - name: Assert average-score output is set
        env:
          AVG: ${{ steps.action.outputs.average-score }}
        run: |
          echo "average-score: $AVG"
          if [ -z "$AVG" ]; then
            echo "FAIL: average-score output is empty"
            exit 1
          fi
          echo "PASS: average-score is '$AVG'"

      - name: Assert critical-count output is set
        env:
          CRIT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRIT"
          if [ -z "$CRIT" ]; then
            echo "FAIL: critical-count output is empty"
            exit 1
          fi
          echo "PASS: critical-count is '$CRIT'"
