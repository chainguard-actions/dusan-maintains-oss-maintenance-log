name: Test basic usage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/config"
          cat > "$GITHUB_WORKSPACE/config/tracked-repositories.json" << 'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 24,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Open",
                "maintainer_needed_signal": "Test repository for CI",
                "tracked_pr_numbers": [1],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-file: config/tracked-repositories.json
          evidence-dir: evidence
          compute-health-scores: "true"

      - name: Assert manifest-json output is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST_JSON: ${{ steps.action.outputs.manifest-json }}
          HEALTH_JSON: ${{ steps.action.outputs.health-json }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          AVG_HEALTH: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "outcome: $OUTCOME"
          echo "manifest-json: $MANIFEST_JSON"
          echo "health-json: $HEALTH_JSON"
          echo "critical-count: $CRITICAL_COUNT"
          echo "avg-health: $AVG_HEALTH"

          if [ "$OUTCOME" = "success" ]; then
            # Verify manifest-json output is set
            if [ -z "$MANIFEST_JSON" ]; then
              echo "FAIL: manifest-json output is empty"
              exit 1
            fi
            echo "PASS: manifest-json output is set to '$MANIFEST_JSON'"

            # Verify health-json output is set
            if [ -z "$HEALTH_JSON" ]; then
              echo "FAIL: health-json output is empty"
              exit 1
            fi
            echo "PASS: health-json output is set to '$HEALTH_JSON'"

            # Verify critical-count is a number
            if ! echo "$CRITICAL_COUNT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL_COUNT'"
              exit 1
            fi
            echo "PASS: critical-count='$CRITICAL_COUNT'"

            # Verify avg-health is a number
            if ! echo "$AVG_HEALTH" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "FAIL: avg-health is not a number: '$AVG_HEALTH'"
              exit 1
            fi
            echo "PASS: avg-health='$AVG_HEALTH'"

          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API calls may fail in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert manifest.json file exists (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "$GITHUB_WORKSPACE/evidence/manifest.json" ]; then
              echo "FAIL: manifest.json file not found at expected path"
              exit 1
            fi
            echo "PASS: manifest.json exists"
            cat "$GITHUB_WORKSPACE/evidence/manifest.json" | head -20
          else
            echo "SKIP: action did not succeed, skipping file assertion"
          fi
