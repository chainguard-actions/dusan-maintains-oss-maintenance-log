name: Test basic scan with no critical findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/basic-pkg
          comment: "false"
          fail-on-critical: "false"

      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail-on-critical=false, the action should always succeed
          # (scan errors are suppressed with || true in the action)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with fail-on-critical=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly with fail-on-critical=false"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
