name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal config file
        run: |
          mkdir -p tests/fixtures/config
          cat > tests/fixtures/config/tracked-repositories.json <<'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 24,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Active",
                "maintainer_needed_signal": "Actively maintained",
                "tracked_pr_numbers": [],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-file: tests/fixtures/config/tracked-repositories.json
          evidence-dir: tests/fixtures/evidence-basic

      - name: Assert manifest-json output is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
          HEALTH: ${{ steps.action.outputs.health-json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "manifest-json: $MANIFEST"
          echo "health-json: $HEALTH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MANIFEST" ]; then
              echo "FAIL: action succeeded but manifest-json output is empty"
              exit 1
            fi
            echo "PASS: manifest-json output is set to '$MANIFEST'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API rate limit or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert manifest file exists when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking for manifest file at: $MANIFEST"
            if [ ! -f "$MANIFEST" ]; then
              echo "FAIL: manifest.json file not found at '$MANIFEST'"
              exit 1
            fi
            echo "PASS: manifest.json exists"
          else
            echo "SKIP: action did not succeed, skipping file check"
          fi

      - name: Assert critical-count and avg-health outputs are set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          AVG: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "outcome: $OUTCOME"
          echo "critical-count: $CRITICAL"
          echo "avg-health: $AVG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CRITICAL" ]; then
              echo "FAIL: critical-count output is empty"
              exit 1
            fi
            if [ -z "$AVG" ]; then
              echo "FAIL: avg-health output is empty"
              exit 1
            fi
            echo "PASS: critical-count=$CRITICAL avg-health=$AVG"
          else
            echo "SKIP: action did not succeed, skipping output checks"
          fi
