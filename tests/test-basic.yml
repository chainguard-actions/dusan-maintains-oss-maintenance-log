name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq
            apt-get install -y -qq wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y -qq powershell
          fi
          pwsh --version

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-file: ${{ github.workspace }}/tests/fixtures/tracked-repositories-minimal.json
          evidence-dir: /tmp/test-evidence-basic
          compute-health-scores: "true"

      - name: Assert manifest-json output is set
        env:
          MANIFEST_PATH: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "manifest-json: $MANIFEST_PATH"
          if [ -z "$MANIFEST_PATH" ]; then
            echo "FAIL: manifest-json output is empty"
            exit 1
          fi
          echo "PASS: manifest-json output is set to $MANIFEST_PATH"

      - name: Assert health-json output is set
        env:
          HEALTH_PATH: ${{ steps.action.outputs.health-json }}
        run: |
          echo "health-json: $HEALTH_PATH"
          if [ -z "$HEALTH_PATH" ]; then
            echo "FAIL: health-json output is empty"
            exit 1
          fi
          echo "PASS: health-json output is set to $HEALTH_PATH"

      - name: Assert manifest.json file exists
        env:
          MANIFEST_PATH: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Checking for manifest file at: $MANIFEST_PATH"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "FAIL: manifest.json file does not exist at $MANIFEST_PATH"
            ls /tmp/test-evidence-basic/ 2>/dev/null || echo "(evidence dir missing)"
            exit 1
          fi
          echo "PASS: manifest.json exists"

      - name: Assert manifest.json is valid JSON with expected fields
        env:
          MANIFEST_PATH: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Validating manifest.json content..."
          SCHEMA_VERSION=$(python3 -c "import json,sys; d=json.load(open('$MANIFEST_PATH')); print(d.get('schema_version',''))")
          echo "schema_version: $SCHEMA_VERSION"
          if [ "$SCHEMA_VERSION" != "1" ]; then
            echo "FAIL: expected schema_version=1, got: $SCHEMA_VERSION"
            exit 1
          fi
          RUN_STATUS=$(python3 -c "import json,sys; d=json.load(open('$MANIFEST_PATH')); print(d.get('run_status',''))")
          echo "run_status: $RUN_STATUS"
          if [ -z "$RUN_STATUS" ]; then
            echo "FAIL: run_status is empty"
            exit 1
          fi
          echo "PASS: manifest.json is valid with schema_version=1 and run_status=$RUN_STATUS"

      - name: Assert critical-count output is numeric
        env:
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL_COUNT"
          if ! echo "$CRITICAL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL_COUNT'"
            exit 1
          fi
          echo "PASS: critical-count=$CRITICAL_COUNT is numeric"

      - name: Assert avg-health output is numeric
        env:
          AVG_HEALTH: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "avg-health: $AVG_HEALTH"
          if ! echo "$AVG_HEALTH" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: avg-health is not a non-negative number: '$AVG_HEALTH'"
            exit 1
          fi
          echo "PASS: avg-health=$AVG_HEALTH is numeric"
