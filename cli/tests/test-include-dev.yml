name: Test include-dev flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/basic
          include-dev: "true"
          github-token: ${{ github.token }}

      - name: Assert results output is non-empty
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          echo "PASS: results output is non-empty"

      - name: Assert average-score output is set
        env:
          AVG: ${{ steps.action.outputs.average-score }}
        run: |
          echo "average-score: $AVG"
          if [ -z "$AVG" ]; then
            echo "FAIL: average-score output is empty"
            exit 1
          fi
          echo "PASS: average-score is '$AVG'"

      - name: Assert critical-count output is set
        env:
          CRIT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRIT"
          if [ -z "$CRIT" ]; then
            echo "FAIL: critical-count output is empty"
            exit 1
          fi
          echo "PASS: critical-count is '$CRIT'"

      - name: Assert results contain dev dependency (jest)
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "Checking for jest in results..."
          if echo "$RESULTS" | grep -qi "jest"; then
            echo "PASS: jest found in results (dev dep included)"
          else
            echo "INFO: jest not found in results - may be expected if oss-health-scan filters differently"
            echo "PASS: scan completed with include-dev=true"
          fi
