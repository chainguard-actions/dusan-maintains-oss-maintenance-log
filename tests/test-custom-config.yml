name: Test custom config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal custom config
        run: |
          mkdir -p /tmp/oss-test-config
          cat > /tmp/oss-test-config/tracked-repositories.json <<'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 48,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Active",
                "maintainer_needed_signal": "Actively maintained",
                "tracked_pr_numbers": [],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-file: /tmp/oss-test-config/tracked-repositories.json
          evidence-dir: /tmp/oss-test-evidence

      - name: Assert outputs are set or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
          HEALTH: ${{ steps.action.outputs.health-json }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          AVG: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "outcome: $OUTCOME"
          echo "manifest-json: $MANIFEST"
          echo "health-json: $HEALTH"
          echo "critical-count: $CRITICAL"
          echo "avg-health: $AVG"

          if [ "$OUTCOME" = "success" ]; then
            # Verify manifest-json output points to the custom evidence dir
            if [ -z "$MANIFEST" ]; then
              echo "FAIL: action succeeded but manifest-json output is empty"
              exit 1
            fi
            if [[ "$MANIFEST" != *"/tmp/oss-test-evidence"* ]]; then
              echo "FAIL: manifest-json path '$MANIFEST' does not reference custom evidence dir"
              exit 1
            fi
            echo "PASS: manifest-json output references custom evidence dir"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API calls may fail in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert critical-count and avg-health are numeric if action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          AVG: ${{ steps.action.outputs.avg-health }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "critical-count: $CRITICAL"
            echo "avg-health: $AVG"
            if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count '$CRITICAL' is not a non-negative integer"
              exit 1
            fi
            if ! echo "$AVG" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "FAIL: avg-health '$AVG' is not a numeric value"
              exit 1
            fi
            echo "PASS: critical-count and avg-health are numeric"
          else
            echo "SKIP: action did not succeed, skipping numeric check"
          fi
