name: "OSS Health Scan"
description: "Scan your dependencies for abandoned, unmaintained, or unhealthy npm packages. Get health scores (0-100) for every dependency."
author: "dusan-maintains"
branding:
  icon: "shield"
  color: "blue"
inputs:
  path:
    description: "Path to directory containing package.json (default: repo root)"
    required: false
    default: "."
  threshold:
    description: "Fail if any package scores below this threshold (0-100)"
    required: false
    default: "0"
  include-dev:
    description: "Include devDependencies in scan"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for higher API rate limits (recommended)"
    required: false
    default: ${{ github.token }}
outputs:
  results:
    description: "JSON scan results"
    value: ${{ steps.scan.outputs.results }}
  average-score:
    description: "Average health score across all dependencies"
    value: ${{ steps.scan.outputs.average }}
  critical-count:
    description: "Number of packages with critical health scores"
    value: ${{ steps.scan.outputs.critical }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Setup Node.js
      uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4
      with:
        node-version: '20'
    - name: Install oss-health-scan
      shell: bash
      run: npm install -g oss-health-scan@latest
    - name: Run health scan
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_INCLUDE_DEV: ${{ inputs.include-dev }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        FLAGS=()
        if [ "$INPUT_INCLUDE_DEV" = "true" ]; then
          FLAGS+=(--dev)
        fi
        if [ "$INPUT_THRESHOLD" != "0" ]; then
          FLAGS+=(--threshold "$INPUT_THRESHOLD")
        fi

        # Run JSON scan for outputs
        RESULTS=$(oss-health-scan "$INPUT_PATH" --json "${FLAGS[@]}" 2>/dev/null || true)
        safe_results=$(printf '%s' "$RESULTS" | tr -d '\n\r')
        echo "results<<EOF" >> "$GITHUB_OUTPUT"
        echo "$safe_results" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        # Extract stats
        AVG=$(echo "$RESULTS" | node -e "const d=require('fs').readFileSync(0,'utf8');try{const j=JSON.parse(d);const s=j.results.filter(r=>r.health_score!=null);console.log((s.reduce((a,r)=>a+r.health_score,0)/s.length).toFixed(1))}catch{console.log('N/A')}")
        CRIT=$(echo "$RESULTS" | node -e "const d=require('fs').readFileSync(0,'utf8');try{const j=JSON.parse(d);console.log(j.results.filter(r=>r.risk_level==='critical').length)}catch{console.log(0)}")
        echo "average=$AVG" >> "$GITHUB_OUTPUT"
        echo "critical=$CRIT" >> "$GITHUB_OUTPUT"

        # Print human-readable report
        oss-health-scan "$INPUT_PATH" "${FLAGS[@]}" --ci || true

        # Fail if critical packages found and threshold > 0
        if [ "$INPUT_THRESHOLD" != "0" ] && [ "$CRIT" -gt 0 ]; then
          echo "::error::$CRIT package(s) scored below threshold $INPUT_THRESHOLD"
          exit 1
        fi
