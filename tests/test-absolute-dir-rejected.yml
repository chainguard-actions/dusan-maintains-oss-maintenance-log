name: Test absolute evidence-dir is rejected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/config"
          cat > "$GITHUB_WORKSPACE/config/tracked-repositories.json" << 'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 24,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Open",
                "maintainer_needed_signal": "Test repository for CI",
                "tracked_pr_numbers": [1],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-file: config/tracked-repositories.json
          evidence-dir: /tmp/absolute-evidence-dir
          compute-health-scores: "false"

      - name: Assert action failed due to absolute evidence-dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected absolute evidence-dir path"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected absolute evidence-dir but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
