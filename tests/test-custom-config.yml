name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            echo "Installing PowerShell..."
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          else
            echo "pwsh already available: $(pwsh --version)"
          fi

      - name: Create minimal custom config
        run: |
          mkdir -p custom-config
          cat > custom-config/tracked-repositories.json << 'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 24,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Active",
                "maintainer_needed_signal": "Well maintained",
                "tracked_pr_numbers": [],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-file: custom-config/tracked-repositories.json
          evidence-dir: evidence-custom-config
        continue-on-error: true

      - name: Assert manifest-json output is set
        env:
          MANIFEST_JSON: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "manifest-json: $MANIFEST_JSON"
          if [ -z "$MANIFEST_JSON" ]; then
            echo "FAIL: manifest-json output is empty"
            exit 1
          fi
          echo "PASS: manifest-json output is set"

      - name: Assert manifest.json file exists
        env:
          MANIFEST_JSON: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Checking for manifest file at: $MANIFEST_JSON"
          if [ ! -f "$MANIFEST_JSON" ]; then
            echo "FAIL: manifest.json not found at $MANIFEST_JSON"
            ls -la evidence-custom-config/ 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          echo "PASS: manifest.json exists"

      - name: Assert manifest.json contains expected repository
        env:
          MANIFEST_JSON: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Checking manifest.json content..."
          cat "$MANIFEST_JSON"
          if ! grep -q "actions/checkout" "$MANIFEST_JSON"; then
            echo "FAIL: manifest.json does not reference 'actions/checkout'"
            exit 1
          fi
          echo "PASS: manifest.json references the configured repository"

      - name: Assert critical-count output is a number
        env:
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL_COUNT"
          if ! echo "$CRITICAL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL_COUNT'"
            exit 1
          fi
          echo "PASS: critical-count=$CRITICAL_COUNT"
