name: Test basic usage with default config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Assert outputs are set or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
          HEALTH: ${{ steps.action.outputs.health-json }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          AVG: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "outcome: $OUTCOME"
          echo "manifest-json: $MANIFEST"
          echo "health-json: $HEALTH"
          echo "critical-count: $CRITICAL"
          echo "avg-health: $AVG"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MANIFEST" ]; then
              echo "FAIL: action succeeded but manifest-json output is empty"
              exit 1
            fi
            if [ -z "$HEALTH" ]; then
              echo "FAIL: action succeeded but health-json output is empty"
              exit 1
            fi
            echo "PASS: outputs are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API calls may fail in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert manifest file exists if action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking manifest file: $MANIFEST"
            if [ ! -f "$MANIFEST" ]; then
              echo "FAIL: manifest file not found at $MANIFEST"
              exit 1
            fi
            echo "PASS: manifest file exists"
          else
            echo "SKIP: action did not succeed, skipping file check"
          fi
