name: Test with compute-health-scores disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-config"
          cat > "$GITHUB_WORKSPACE/test-config/tracked-repositories.json" <<'EOF'
          {
            "version": 1,
            "contributor": "test-user",
            "default_sla_hours": 24,
            "repositories": [
              {
                "owner": "actions",
                "repo": "checkout",
                "package": null,
                "status_label": "Active",
                "maintainer_needed_signal": "Actively maintained",
                "tracked_pr_numbers": [],
                "review_sla_base_name": "review-sla-checkout"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-file: test-config/tracked-repositories.json
          evidence-dir: no-health-evidence
          compute-health-scores: "false"
        continue-on-error: true

      - name: Assert action ran and manifest output is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MANIFEST_JSON: ${{ steps.action.outputs.manifest-json }}
          HEALTH_JSON: ${{ steps.action.outputs.health-json }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          AVG: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "outcome: $OUTCOME"
          echo "manifest-json: $MANIFEST_JSON"
          echo "health-json: $HEALTH_JSON"
          echo "critical-count: $CRITICAL"
          echo "avg-health: $AVG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MANIFEST_JSON" ]; then
              echo "FAIL: manifest-json output is empty even with compute-health-scores=false"
              exit 1
            fi
            echo "PASS: manifest-json output is set to '$MANIFEST_JSON'"
            # critical-count and avg-health should still be set (defaulting to 0 if no health file)
            if [ -z "$CRITICAL" ]; then
              echo "FAIL: critical-count output is empty"
              exit 1
            fi
            if [ -z "$AVG" ]; then
              echo "FAIL: avg-health output is empty"
              exit 1
            fi
            echo "PASS: critical-count=$CRITICAL avg-health=$AVG"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to API limits or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert manifest file exists when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            MANIFEST_PATH="no-health-evidence/manifest.json"
            if [ ! -f "$MANIFEST_PATH" ]; then
              echo "FAIL: manifest.json not found at $MANIFEST_PATH"
              exit 1
            fi
            echo "PASS: manifest.json exists"
          else
            echo "SKIP: action did not succeed, skipping file check"
          fi
