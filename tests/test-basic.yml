name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell if not present
        run: |
          if ! command -v pwsh &>/dev/null; then
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" \
              -O /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -y -q powershell
          fi
          pwsh --version

      - name: Set up scripts symlink at workspace root
        run: |
          # The action uses ./scripts/ relative to the working directory (workspace root)
          # but the scripts live in action/scripts/ — create a symlink so the path resolves
          if [ ! -e "$GITHUB_WORKSPACE/scripts" ]; then
            ln -sf "$GITHUB_WORKSPACE/action/scripts" "$GITHUB_WORKSPACE/scripts"
          fi

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-file: ${{ github.workspace }}/tests/fixtures/config/tracked-repositories.json
          evidence-dir: /tmp/test-evidence-basic

      - name: Assert manifest-json output is set
        env:
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "manifest-json: $MANIFEST"
          if [ -z "$MANIFEST" ]; then
            echo "FAIL: manifest-json output is empty"
            exit 1
          fi
          echo "PASS: manifest-json output is set to $MANIFEST"

      - name: Assert manifest.json file exists
        env:
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Checking for manifest file at: $MANIFEST"
          if [ ! -f "$MANIFEST" ]; then
            echo "FAIL: manifest.json file not found at $MANIFEST"
            ls -la /tmp/test-evidence-basic/ || echo "(directory listing failed)"
            exit 1
          fi
          echo "PASS: manifest.json exists"

      - name: Assert manifest.json is valid JSON
        env:
          MANIFEST: ${{ steps.action.outputs.manifest-json }}
        run: |
          echo "Validating JSON content of $MANIFEST"
          if ! python3 -c "import json,sys; json.load(open('$MANIFEST'))" 2>&1; then
            echo "FAIL: manifest.json is not valid JSON"
            exit 1
          fi
          echo "PASS: manifest.json is valid JSON"

      - name: Assert health-json output is set
        env:
          HEALTH: ${{ steps.action.outputs.health-json }}
        run: |
          echo "health-json: $HEALTH"
          if [ -z "$HEALTH" ]; then
            echo "FAIL: health-json output is empty"
            exit 1
          fi
          echo "PASS: health-json output is set to $HEALTH"

      - name: Assert critical-count output is a number
        env:
          CRITICAL: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL"
          if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count is not a non-negative integer: '$CRITICAL'"
            exit 1
          fi
          echo "PASS: critical-count is a valid number: $CRITICAL"

      - name: Assert avg-health output is a number
        env:
          AVG: ${{ steps.action.outputs.avg-health }}
        run: |
          echo "avg-health: $AVG"
          if ! echo "$AVG" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: avg-health is not a valid number: '$AVG'"
            exit 1
          fi
          echo "PASS: avg-health is a valid number: $AVG"
